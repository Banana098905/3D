<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASSIVE ENGINE — 別サイトから読み込むテンプレート</title></head>
<body style="font-family:system-ui,sans-serif;background:#08111f;color:#e5eefb;padding:20px">
<h1 style="font-size:1.2rem">別サイトからの読み込みテンプレート</h1>
<p>GitHub Pages で公開したら、下の <code>YOUR-USERNAME</code> と <code>YOUR-REPOSITORY</code> を実際の値に置き換えてください。<b>置き換える前はエンジンを読み込めません</b>（プレースホルダのままでは公開しないでください）。</p>
<canvas id="world" style="width:100%;height:360px;display:block;background:#08111d;border-radius:8px"></canvas>
<p id="msg" style="color:#ff9ca8"></p>
<!-- 1) クラシック script: window.MassiveEngine が使えます -->
<script src="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/dist/massive-engine.min.js" onerror="document.getElementById('msg').textContent='エンジンを読み込めません。URLのプレースホルダを置き換えてください。'"></script>
<script>
  if (window.MassiveEngine) {
    const engine = MassiveEngine.create({ canvas: document.getElementById('world'), onError: e => { document.getElementById('msg').textContent = e.message; } });
    engine.addBox({ position: [0, 0.5, 0], color: '#ff8a2a' }); engine.addGrid(10, 10);
    window.addEventListener('pagehide', () => engine.dispose(), { once: true });
  }
</script>
<!-- 2) ES Modules で読み込む場合:
<script type="module">
  import { create } from 'https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/dist/massive-engine.esm.min.js';
</script> -->
</body></html>
